[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storyseed"
version = "0.1.0"
description = "Learn language modeling through small, inspectable implementations"
requires-python = ">=3.10"
dependencies = ["torch==2.6.0"]

[tool.setuptools.packages.find]
where = ["src"]
